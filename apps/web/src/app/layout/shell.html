<div class="shell">
  <header class="topbar">
    <span class="brand">Paula</span>
    <nav class="views" aria-label="Vistas de bandeja">
      <a routerLink="/app/inbox/mine" routerLinkActive="active">Mis conversaciones</a>
      <a routerLink="/app/inbox/unassigned" routerLinkActive="active">Sin asignar</a>
      <a routerLink="/app/inbox/all" routerLinkActive="active">Todas</a>
      <a routerLink="/app/inbox/closed" routerLinkActive="active">Cerradas</a>
    </nav>
    <div class="user-box">
      <span
        class="conn"
        [class.on]="realtime.status() === 'connected'"
        [class.off]="realtime.status() !== 'connected'"
        [title]="'Realtime: ' + realtime.status()"
      >
        {{ realtime.status() === 'connected' ? 'En linea' : 'Reconectando...' }}
      </span>
      <span class="user">{{ auth.user()?.name }}</span>
      <button type="button" class="logout" (click)="logout()">Salir</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
